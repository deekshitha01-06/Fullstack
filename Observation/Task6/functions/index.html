<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions and Classes</title>
</head>
<body>

    <h1>JavaScript Functions and Classes</h1>

    <div id="output"></div>

    <script>


        // Class example
        class Student {

            constructor(name, rollNo, department) {
                this.name = name;
                this.rollNo = rollNo;
                this.department = department;
            }

            display() {
                return "Name: " + this.name +
                       "<br>Roll No: " + this.rollNo +
                       "<br>Department: " + this.department;
            }
        }

        
        // Creating multiple objects
        let student1 = new Student("Deekshitha", 101, "AI&ML");
        let student2 = new Student("Rahul", 102, "CSE");
        let student3 = new Student("Priya", 103, "ECE");

        // Display output
        document.getElementById("output").innerHTML =
            student1.display() + "<hr>" +
            student2.display() + "<hr>" +
            student3.display();

    </script>

</body>
</html>
