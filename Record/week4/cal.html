<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Marks Calculator</h2>

        <input type="number" id="m1" placeholder="Subject 1 Marks"><br>
        <input type="number" id="m2" placeholder="Subject 2 Marks"><br>
        <input type="number" id="m3" placeholder="Subject 3 Marks"><br>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>
    </div>

    <script>
        function calculate() {

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;
            let average = total / 3;

            let grade;

            if (average >= 90)
                grade = "A+";
            else if (average >= 75)
                grade = "A";
            else if (average >= 60)
                grade = "B";
            else if (average >= 40)
                grade = "C";
            else
                grade = "Fail";

            document.getElementById("result").innerHTML =
                "Total: " + total +
                "<br>Average: " + average.toFixed(2) +
                "<br>Grade: " + grade;
        }
    </script>

</body>
</html>
